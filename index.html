<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSHO Announcement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .announcement-container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .banner-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="announcement-container">
    <!-- เปลี่ยน URL รูปภาพตรง src เป็นรูปประกาศของคุณได้เลย -->
    <img class="banner-img" src="news.png" alt="Game Announcement" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x450/111827/FFFFFF?text=ANNOUNCEMENT+COMMING+SOON';">
  </div>

</body>
</html>
